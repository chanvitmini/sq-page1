<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ธุรกิจออนไลน์</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <style>

        /* ================================
           GLOBAL
        ================================= */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            padding: 0;
            background: #ffffff;
            font-family: Arial, "Noto Sans Thai", sans-serif;
            overflow-x: hidden;
        }

        main {
            width: 100%;
        }

        /* ================================
           MAIN CONTAINER
        ================================= */

        .page-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ================================
           IMAGE
        ================================= */

        .responsive-img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            margin: 0 auto;
        }

        /* ================================
           IMAGE SECTION
        ================================= */

        .image-section {
            width: 100%;
            margin-bottom: 15px;
            text-align: center;
        }

        .image-section a {
            display: block;
            width: 100%;
        }

        .image-section img {
            display: block;
            width: 100%;
            height: auto;
            max-width: 100%;
            margin: 0 auto;
        }

        /* ================================
           VIDEO
        ================================= */

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin: 20px auto;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            border: 0;
        }

        /* ================================
           DESKTOP
        ================================= */

        @media (min-width: 992px) {

            .page-container {
                max-width: 900px;
                padding: 30px;
            }

            .image-section {
                margin-bottom: 20px;
            }

        }

        /* ================================
           TABLET
        ================================= */

        @media (min-width: 576px) and (max-width: 991px) {

            .page-container {
                max-width: 760px;
                padding: 20px;
            }

        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 575px) {

            .page-container {
                width: 100%;
                padding: 10px;
            }

            .image-section {
                margin-bottom: 10px;
            }

            .video-container {
                margin: 15px auto;
                border-radius: 6px;
            }

        }

    </style>

</head>


<body>

    <main>

                    title="YouTube video player"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
